services:
  app:
    image: ghcr.io/cannoi/localhost-hub:latest
    restart: unless-stopped
    init: true
    ports:
      - "${HOST_PORT:-48080}:8080"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      HUB_DATA_DIR: /data/ofie-hub
      HUB_SECRET: ${HUB_SECRET:-}
      HUB_TRUST_PROXY: ${HUB_TRUST_PROXY:-}
      VITE_AUTH_ENABLED: "false"
      NITRO_PRESET: node-server
    volumes:
      - hub-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  hub-data:
